name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      MPLBACKEND: Agg  # evita que matplotlib intente abrir una ventana en el runner (sin pantalla)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install DATKit and its dependencies
        run: pip install .

      - name: Run demo as a smoke test
        run: python demo/example_process.py

      - name: Verify demo outputs were generated
        run: |
          test -s demo/saves/demo_linechart.svg
          test -s demo/saves/demo_heatmap.svg
          test -s demo/saves/demo_dendrogram.svg
          test -s demo/saves/demo_report.pdf