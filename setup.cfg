[metadata]
name = TAUP-DATKit
version = 0.5.1
description = A package for chromatographic data analysis
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/igmarco/DATKit
author = Ignacio Marco-Pérez, Jónathan Heras-Vicente
author_email = igmarco@unirioja.es, joheras@unirioja.es
keywords = chromatographic, data analysis, data filtering, data visualization

[options]
packages = 
	DATKit
	DATKit.properties
	DATKit.tools
	DATKit.utils
install_requires =
	CairoSVG>=2.7.1
	matplotlib>=3.10.0
	numpy>=1.26.0
	openpyxl>=3.0.10
	pandas>=2.2.2
	reportlab>=4.2.5
	scikit-learn>=1.6.0
	scipy>=1.7.0
	seaborn>=0.13.2
	setuptools>=60.0.0
python_requires = 
	>=3.11
include_package_data = True

[egg_info]
tag_build = 
tag_date = 0

